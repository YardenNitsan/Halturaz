<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;background:#0e0d0c;color:#f2ede7;font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:#F1A252;text-decoration:none;} a:hover{color:#f7bd80;}
    .dsp{font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
    button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
    ::-webkit-scrollbar{width:0;}
    .d{transition:background .13s ease;}
  </style>
</helmet>

<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#0e0d0c;overflow:hidden;">

  <header style="flex:0 0 auto;padding:18px 18px 12px;display:flex;align-items:center;gap:12px;">
    <div style="display:flex;align-items:baseline;gap:8px;">
      <h1 class="dsp" style="margin:0;font-size:26px;font-weight:700;letter-spacing:-0.028em;line-height:1;">{{monthName}}</h1>
      <span class="mono" style="font-size:15px;color:#6f665e;">{{year}}</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:4px;">
      <button onClick="{{prevMonth}}" aria-label="Previous month" style="width:44px;height:44px;border-radius:10px;border:1px solid #242020;display:flex;align-items:center;justify-content:center;color:#a39a91;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
      </button>
      <button onClick="{{nextMonth}}" aria-label="Next month" style="width:44px;height:44px;border-radius:10px;border:1px solid #242020;display:flex;align-items:center;justify-content:center;color:#a39a91;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5 16 12l-6.5 6.5"></path></svg>
      </button>
    </div>
  </header>

  <div style="flex:0 0 auto;padding:0 12px 10px;">
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:6px;">
      <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
        <div style="font-size:9.5px;font-weight:600;letter-spacing:0.1em;color:#4f4842;text-align:center;">{{w}}</div>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
        <button class="d" onClick="{{c.pick}}" style="{{c.style}}">
          <span class="mono" style="{{c.numStyle}}">{{c.label}}</span>
          <span style="{{c.dotStyle}}"></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="flex:1;min-height:0;overflow-y:auto;padding:6px 16px 16px;">
    <sc-if value="{{hasEvent}}" hint-placeholder-val="{{true}}">
      <div style="{{heroStyle}}">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;">
          <span style="{{badgeStyle}}">{{badgeText}}</span>
          <span style="font-size:11px;color:#6f665e;">{{sel.weekday}}</span>
        </div>
        <div class="dsp" style="font-size:23px;font-weight:700;letter-spacing:-0.025em;margin-bottom:8px;">{{sel.title}}</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#a39a91;margin-bottom:14px;">
          <span class="mono" style="color:#f2ede7;font-weight:500;">{{sel.time}}</span>
          <span style="color:#3a332e;">·</span>
          <span>{{sel.place}}</span>
        </div>
        <div style="display:flex;align-items:flex-end;gap:2px;height:24px;margin-bottom:15px;">
          <sc-for list="{{wave}}" as="b" hint-placeholder-count="42">
            <div style="{{b.style}}"></div>
          </sc-for>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="display:flex;flex-direction:column;">
            <span class="mono" style="font-size:16px;font-weight:500;">{{sel.songs}}</span>
            <span style="font-size:10px;color:#6f665e;">songs</span>
          </div>
          <div style="width:1px;height:26px;background:#26221f;"></div>
          <div style="display:flex;flex-direction:column;">
            <span class="mono" style="font-size:16px;font-weight:500;">{{sel.runtime}}</span>
            <span style="font-size:10px;color:#6f665e;">runtime</span>
          </div>
          <button style="{{openBtnStyle}}">
            Open
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12.5 6l6 6-6 6"></path></svg>
          </button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{noEvent}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 18px;border:1px dashed #2b2622;border-radius:16px;text-align:center;margin-bottom:22px;">
        <div class="dsp" style="font-size:19px;font-weight:600;letter-spacing:-0.02em;">{{sel.title}}</div>
        <div style="font-size:12.5px;color:#6f665e;line-height:1.55;">Nothing booked. Grab the room.</div>
        <button style="{{addBtnStyle}}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"></path></svg>
          Add rehearsal
        </button>
      </div>
    </sc-if>

    <div style="font-size:10px;font-weight:600;letter-spacing:0.13em;color:#5d554e;margin:22px 0 11px 2px;">COMING UP</div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <sc-for list="{{upcoming}}" as="u" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:13px;background:#141211;border:1px solid #1f1c1a;">
          <div style="display:flex;flex-direction:column;align-items:center;width:38px;flex:0 0 auto;">
            <span style="{{u.monStyle}}">{{u.mon}}</span>
            <span class="mono" style="font-size:17px;font-weight:500;line-height:1.1;">{{u.day}}</span>
          </div>
          <div style="width:1px;height:30px;background:#221f1c;"></div>
          <div style="min-width:0;flex:1;">
            <div style="font-size:14px;font-weight:500;color:#e8e2db;">{{u.label}}</div>
            <div style="font-size:11.5px;color:#6f665e;margin-top:2px;">{{u.sub}}</div>
          </div>
          <span style="{{u.tagStyle}}">{{u.tag}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav style="flex:0 0 auto;background:#111010;border-top:1px solid #1c1917;padding:8px 22px 20px;display:flex;align-items:center;justify-content:space-between;">
    <button style="{{tabActiveStyle}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 9.6h17M8 3v4M16 3v4"></path></svg>
      <span style="font-size:10px;font-weight:600;">Calendar</span>
    </button>
    <button style="{{fabStyle}}" aria-label="New rehearsal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"></path></svg>
    </button>
    <button style="{{tabStyle}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="18" r="3"></circle><circle cx="18" cy="15.5" r="3"></circle><path d="M10 18V6.2l11-2.2v11.5"></path></svg>
      <span style="font-size:10px;font-weight:500;">Songs</span>
    </button>
  </nav>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#F1A252","options":["#F1A252","#35C2C7","#E4705A","#9BC46A"],"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { y: 2026, m: 7, sel: '2026-08-29' };
  }

  data() {
    return {
      '2026-08-04': { kind: 'r', time: '20:00', place: 'Rehearsal Room B', n: 6, mins: 31 },
      '2026-08-11': { kind: 'r', time: '20:00', place: 'Rehearsal Room B', n: 7, mins: 37 },
      '2026-08-18': { kind: 'r', time: '20:00', place: 'Studio 9', n: 8, mins: 39 },
      '2026-08-22': { kind: 'r', time: '14:00', place: 'Studio 9', n: 9, mins: 44 },
      '2026-08-29': { kind: 'r', time: '19:00', place: 'Studio 9', n: 8, mins: 39, tonight: true },
      '2026-09-01': { kind: 'r', time: '20:00', place: 'Rehearsal Room B', n: 7, mins: 35 },
      '2026-09-05': { kind: 's', time: '21:30', place: 'Levontin 7', n: 11, mins: 52 },
      '2026-09-08': { kind: 'r', time: '20:00', place: 'Studio 9', n: 8, mins: 40 },
      '2026-09-15': { kind: 'r', time: '20:00', place: 'Studio 9', n: 8, mins: 40 },
      '2026-07-21': { kind: 'r', time: '20:00', place: 'Studio 9', n: 7, mins: 36 },
      '2026-07-28': { kind: 'r', time: '20:00', place: 'Studio 9', n: 8, mins: 41 }
    };
  }

  pad(n) { return n < 10 ? '0' + n : '' + n; }
  iso(y, m, d) { return y + '-' + this.pad(m + 1) + '-' + this.pad(d); }

  rgba(hex, a) {
    const h = ('' + (hex || '#F1A252')).replace('#', '');
    const n = h.length === 3 ? h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2) : h;
    const r = parseInt(n.substr(0, 2), 16), g = parseInt(n.substr(2, 2), 16), b = parseInt(n.substr(4, 2), 16);
    if (isNaN(r) || isNaN(g) || isNaN(b)) return 'rgba(241,162,82,' + a + ')';
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  renderVals() {
    const accent = this.props.accent || '#F1A252';
    const A = (a) => this.rgba(accent, a);
    const TEAL = '#35C2C7';
    const TODAY = '2026-08-29';
    const st = this.state;
    const events = this.data();
    const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    const first = new Date(Date.UTC(st.y, st.m, 1)).getUTCDay();
    const dim = new Date(Date.UTC(st.y, st.m + 1, 0)).getUTCDate();
    const prevDim = new Date(Date.UTC(st.y, st.m, 0)).getUTCDate();

    const cells = [];
    for (let i = 0; i < 42; i++) {
      const dnum = i - first + 1;
      const inMonth = dnum >= 1 && dnum <= dim;
      const label = inMonth ? dnum : (dnum < 1 ? prevDim + dnum : dnum - dim);
      const key = inMonth ? this.iso(st.y, st.m, dnum) : null;
      const ev = key ? events[key] : null;
      const isSel = key === st.sel;
      const isToday = key === TODAY;
      const tint = ev && ev.kind === 's' ? TEAL : accent;
      cells.push({
        label: '' + label,
        style: 'height:46px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:'
          + (isSel ? (ev ? '' + A(0.14) + '' : '#1c1917') : 'transparent')
          + ';border:1px solid ' + (isSel ? tint : 'transparent') + ';opacity:' + (inMonth ? 1 : 0.32) + ';',
        numStyle: 'font-size:13px;font-weight:' + (isToday || isSel ? '600' : '400') + ';color:' + (isSel ? '#f2ede7' : (isToday ? tint : (ev ? '#d9d2cb' : '#7a726a'))) + ';',
        dotStyle: ev ? 'width:5px;height:5px;border-radius:99px;background:' + tint + ';' : 'width:5px;height:5px;',
        pick: inMonth ? () => this.setState({ sel: key }) : () => {}
      });
    }

    const selParts = st.sel.split('-').map(Number);
    const selDate = new Date(Date.UTC(selParts[0], selParts[1] - 1, selParts[2]));
    const ev = events[st.sel];
    const show = ev && ev.kind === 's';
    const tint = show ? TEAL : accent;

    const wave = [];
    const seed = [3,7,12,18,11,6,14,22,17,9,5,13,24,19,10,7,16,26,21,12,6,11,20,24,19,14,8,15,22,18,9,5,12,21,16,10,6,13,19,15,8,4];
    for (let i = 0; i < seed.length; i++) {
      wave.push({ style: 'flex:1;border-radius:1.5px;height:' + Math.max(3, seed[i] * 0.85) + 'px;background:' + (i < 16 ? tint : '#2b2622') + ';' });
    }

    const upcoming = [
      { mon: 'SEP', day: '01', label: 'Rehearsal', sub: '20:00 · Rehearsal Room B', tag: '7 songs' },
      { mon: 'SEP', day: '05', label: 'Levontin 7', sub: '21:30 · Doors 20:30', tag: 'Show', show: true },
      { mon: 'SEP', day: '08', label: 'Rehearsal', sub: '20:00 · Studio 9', tag: '8 songs' },
      { mon: 'SEP', day: '15', label: 'Rehearsal', sub: '20:00 · Studio 9', tag: '8 songs' }
    ];

    return {
      accent: accent,
      weekdays: ['Su','Mo','Tu','We','Th','Fr','Sa'],
      monthName: MON[st.m],
      year: '' + st.y,
      cells: cells,
      prevMonth: () => { const m = st.m - 1; this.setState(m < 0 ? { m: 11, y: st.y - 1 } : { m: m }); },
      nextMonth: () => { const m = st.m + 1; this.setState(m > 11 ? { m: 0, y: st.y + 1 } : { m: m }); },
      hasEvent: !!ev,
      noEvent: !ev,
      sel: {
        weekday: WD[selDate.getUTCDay()],
        title: MON[selParts[1] - 1] + ' ' + selParts[2],
        time: ev ? ev.time : '',
        place: ev ? ev.place : '',
        songs: ev ? '' + ev.n : '',
        runtime: ev ? ev.mins + 'm' : ''
      },
      badgeText: ev && ev.tonight ? 'TONIGHT' : (show ? 'SHOW' : 'REHEARSAL'),
      badgeStyle: 'font-size:9px;font-weight:700;letter-spacing:0.14em;padding:4px 8px;border-radius:5px;color:' + tint + ';background:' + (show ? 'rgba(53,194,199,0.12)' : '' + A(0.12) + '') + ';',
      heroStyle: 'padding:18px 17px;border-radius:17px;background:#141211;border:1px solid ' + (show ? 'rgba(53,194,199,0.2)' : '' + A(0.2) + '') + ';',
      wave: wave,
      openBtnStyle: 'margin-left:auto;height:44px;padding:0 17px;border-radius:11px;background:' + accent + ';color:#17120c;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;',
      addBtnStyle: 'height:44px;padding:0 18px;border-radius:11px;background:' + accent + ';color:#17120c;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;',
      upcoming: upcoming.map((u) => Object.assign({}, u, {
        monStyle: 'font-size:9.5px;font-weight:600;letter-spacing:0.1em;color:' + (u.show ? TEAL : '#5d554e') + ';',
        tagStyle: 'font-size:10.5px;font-weight:' + (u.show ? '600' : '400') + ';color:' + (u.show ? TEAL : '#5d554e') + ';background:' + (u.show ? 'rgba(53,194,199,0.10)' : 'transparent') + ';padding:' + (u.show ? '4px 8px' : '0') + ';border-radius:5px;flex:0 0 auto;'
      })),
      tabActiveStyle: 'display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;height:52px;justify-content:center;color:' + accent + ';',
      tabStyle: 'display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;height:52px;justify-content:center;color:#5d554e;',
      fabStyle: 'width:52px;height:52px;border-radius:16px;background:' + accent + ';color:#17120c;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px ' + A(0.22) + ';'
    };
  }
}
</script>
</body>
</html>
